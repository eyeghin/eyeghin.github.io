name: The Alert Room - Browser QA
on:
  push:
    branches: [main, brand-story-reset, floating-analyst-agent-ux, cinematic-studio-reset-2026, casework-quality-pass]
    paths:
      - "the-alert-room/frame.js"
      - "the-alert-room/frame.css"
      - "the-alert-room/brand.css"
      - "the-alert-room/story.css"
      - "the-alert-room/story-engine.js"
      - "the-alert-room/vision.js"
      - "the-alert-room/vision.css"
      - "the-alert-room/polish.css"
      - "the-alert-room/analyst-lite.js"
      - "the-alert-room/experience.css"
      - "the-alert-room/navigation.css"
      - "the-alert-room/artdirection.css"
      - "the-alert-room/immersive.js"
      - "the-alert-room/cinema.js"
      - "the-alert-room/cinema.css"
      - "the-alert-room/analyst.js"
      - "the-alert-room/floating-agent.js"
      - "the-alert-room/floating-agent.css"
      - "the-alert-room/analyst.css"
      - "the-alert-room/data.js"
      - "the-alert-room/index.html"
      - "the-alert-room/browser-qa.cjs"
      - ".github/workflows/alert-room-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Install browser testing library
        run: npm install --no-save playwright-core
      - name: Serve static site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/alert-room-server.log 2>&1 &
          echo $! > /tmp/alert-room-server.pid
      - name: Test user journeys and capture visual renders
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node the-alert-room/browser-qa.cjs
      - name: Upload screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alert-room-visual-qa
          path: visual-qa/*.jpg
          if-no-files-found: ignore


