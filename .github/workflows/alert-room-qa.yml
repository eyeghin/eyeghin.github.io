name: The Alert Room - Browser QA
on:
  push:
    branches: [main]
    paths:
      - "the-alert-room/frame.js"
      - "the-alert-room/frame.css"
      - "the-alert-room/artdirection.css"
      - "the-alert-room/immersive.js"
      - "the-alert-room/data.js"
      - "the-alert-room/index.html"
      - "the-alert-room/browser-qa.cjs"
      - ".github/workflows/alert-room-qa.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Install browser testing library
        run: npm install --no-save playwright-core
      - name: Serve static site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/alert-room-server.log 2>&1 &
          echo $! > /tmp/alert-room-server.pid
      - name: Test user journeys and capture visual renders
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node the-alert-room/browser-qa.cjs
      - name: Upload screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alert-room-visual-qa
          path: visual-qa/*.jpg
          if-no-files-found: ignore


      - name: Save verified visual snapshots to source control
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-qa/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Update verified browser screenshots [skip ci]"
            git push origin HEAD:main
          fi
