name: The Alert Room V2 — Full Product Browser QA
on:
  push:
    branches: [rebuild-aml-product-2026]
    paths:
      - "the-alert-room/**"
      - ".github/workflows/alert-room-product-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - run: npm install --no-save playwright-core
      - name: Start local GitHub Pages preview
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/alert-room-product.log 2>&1 &
          echo $! > /tmp/alert-room-pid
      - name: Check navigation, real cases, QA reviewer, agent, and responsive pages
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node the-alert-room/product-browser-qa.cjs
      - name: Upload rendered website screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alert-room-multipage-screenshots
          path: visual-qa-v2/*.png
          if-no-files-found: ignore
